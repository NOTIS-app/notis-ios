name: PR Check

# Upstream Foqos check (lint, unit tests, Mac tests). Manual only, to save macOS minutes;
# NOTIS builds run in testflight.yml.
on:
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install swift-format
        run: brew install swift-format

      - name: Check Swift formatting
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Run Mac TCP/TLS tests
        run: make mac-test
