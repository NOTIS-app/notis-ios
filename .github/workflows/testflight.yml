name: iOS build & TestFlight

# Two jobs, so you only spend a full signed build when you want one:
# - check:      every push to main or a notis/** branch. Compiles for the simulator, no Apple account
#               needed. Tells you whether the code builds.
# - testflight: push to the `testflight` branch, or "Run workflow" on GitHub. Archives, signs
#               and uploads to App Store Connect. Needs the secrets listed in docs/NOTIS-TESTFLIGHT.md.

on:
  push:
    branches:
      - main
      - "notis/**"
      - testflight
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.3.app
  PROJECT: foqos.xcodeproj
  SCHEME: foqos

jobs:
  check:
    if: github.ref != 'refs/heads/testflight' && github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Build for simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*NOTIS|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      # A simulator build you can open in the browser via appetize.io (see docs/NOTIS-TESTFLIGHT.md).
      - name: Zip simulator app
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/NOTIS-simulator.zip" foqos.app

      - name: Keep simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NOTIS-simulator
          path: NOTIS-simulator.zip
          retention-days: 14

      # Compile errors as annotations: readable on the run page and through the public API,
      # without downloading the log (which needs a GitHub login).
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error: " build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Keep build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  testflight:
    if: github.ref == 'refs/heads/testflight' || (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Build numbers must keep rising; the run number does that for free.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See docs/NOTIS-TESTFLIGHT.md, step 4."
              exit 1
            fi
          done

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed, automatic signing via API key)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NOTIS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" Config/TestFlightExportOptions.plist \
            > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NOTIS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log
          echo "Build $BUILD_NUMBER uploaded. Apple processes it in ~10-30 minutes, then it shows in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
